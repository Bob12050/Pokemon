<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Monster Emerald — オリジナルモンスターRPG</title>
<link rel="stylesheet" href="style.css?v=3">
</head>
<body>
  <div id="frame">
    <div id="screen-wrap">
      <canvas id="game" width="240" height="160"></canvas>
      <div id="loading">よみこみちゅう…</div>
    </div>
    <div id="controls">
      <div class="dpad">
        <button class="btn" data-key="ArrowUp">▲</button>
        <div class="dpad-mid">
          <button class="btn" data-key="ArrowLeft">◀</button>
          <button class="btn dpad-center" disabled>＋</button>
          <button class="btn" data-key="ArrowRight">▶</button>
        </div>
        <button class="btn" data-key="ArrowDown">▼</button>
      </div>
      <div class="ab">
        <button class="btn round" data-key="KeyX">B</button>
        <button class="btn round" data-key="KeyZ">A</button>
      </div>
      <div class="se">
        <button class="btn small" data-key="Enter">START</button>
      </div>
    </div>
    <p class="hint">操作: 矢印キー = 移動 / Z = けってい(A) / X = キャンセル(B) / Enter = メニュー(START)</p>
  </div>

  <!-- 読み込み順序が重要（グローバル名前空間共有） -->
  <!-- ?v= はキャッシュ対策。コードを更新したら数字を上げる -->
  <script src="src/data.js?v=3"></script>
  <script src="src/sprites.js?v=3"></script>
  <script src="src/audio.js?v=3"></script>
  <script src="src/engine.js?v=3"></script>
  <script src="src/maps.js?v=3"></script>
  <!-- 画像アセット（任意・無ければ手続き描画にフォールバック） -->
  <script src="assets/manifest.js?v=3"></script>
  <script src="src/assets.js?v=3"></script>
  <script src="src/battle.js?v=3"></script>
  <script src="src/overworld.js?v=3"></script>
  <script src="src/menu.js?v=3"></script>
  <script src="src/main.js?v=3"></script>
</body>
</html>
